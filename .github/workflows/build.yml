name: Build Weighted Icon Randomizer

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: Weighted-Icon-Randomizer
          path: |
            build/*.geode
            build-*/**/*.geode
          if-no-files-found: error
