name: Build Weighted Icon Randomizer

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Geode CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/geode-sdk/cli/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check Geode CLI
        run: |
          geode --version

      - name: Install Geode SDK
        run: |
          geode sdk install
          geode sdk install-binaries

      - name: Build .geode mod
        run: |
          geode build

      - name: Find generated .geode
        run: |
          find . -type f -name "*.geode" -print

      - name: Upload .geode mod
        uses: actions/upload-artifact@v4
        with:
          name: Weighted-Icon-Randomizer-geode
          path: "**/*.geode"
          if-no-files-found: error
